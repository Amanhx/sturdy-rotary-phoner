<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-viewport-height: 100vh;
            --tg-safe-area-inset-top: env(safe-area-inset-top);
            --tg-safe-area-inset-bottom: env(safe-area-inset-bottom);
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000, #200010);
            color: white;
            height: var(--tg-viewport-height);
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: row;
            height: 100%;
        }
        .main {
            flex: 3;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .side {
            flex: 1.5;
            background: linear-gradient(to bottom, #c71585, #ff006e);
            padding: 15px;
            overflow-y: auto;
        }
        h1 {
            font-size: 2.2em;
            text-shadow: 0 0 20px #ff1493;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #ff69b4; }
            to { text-shadow: 0 0 40px #ff1493; }
        }
        .btn {
            background: linear-gradient(45deg, #ff006e, #ff4d4d);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.4em;
            border-radius: 50px;
            margin: 20px 0;
            cursor: pointer;
            box-shadow: 0 0 30px #ff1493;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px #ff69b4;
        }
        .card {
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            margin: 12px 0;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .card:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px #ff1493;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
            height: 140px;
            object-fit: cover;
        }
        .loading {
            font-size: 1.4em;
            color: #ff69b4;
            margin-bottom: 15px;
        }

        /* Mobile responsive: Side bar bottom pe shift for small screens */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .main {
                flex: none;
                height: 50%;
                padding: 15px;
            }
            .side {
                flex: none;
                height: 50%;
                border-top: 3px solid #ff1493;
            }
            h1 { font-size: 1.8em; }
            .btn { padding: 12px 30px; font-size: 1.2em; }
        }
    </style>
</head>
<body>

    <script>
